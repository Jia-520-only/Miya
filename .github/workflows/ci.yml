name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 0'

env:
  PYTHON_VERSION: '3.11'

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install tools
      run: |
        pip install "ruff>=0.14.0,<0.15.0" black bandit
        ruff --version

    - name: Run ruff linting
      run: ruff check . --config pyproject.toml --output-format=github

    - name: Run black formatting check
      run: black --check core/ hub/ run/ || true

    - name: Run security audit
      run: bandit -r core/ hub/ run/ -ll -f custom 2>&1 || true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality-checks

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Install system dependencies
      run: sudo apt-get update -y && sudo apt-get install -y libasound2-dev

    - name: Install dependencies
      run: |
        uv venv
        uv pip install -r setup/requirements/full.txt -r setup/dependencies/dev.txt

    - name: Run unit tests
      run: uv run pytest tests/unit/ -v --cov=core --cov=run --cov-report=xml --cov-report=term-missing || echo "No unit tests found"

    - name: Upload coverage
      if: hashFiles('coverage.xml') != ''
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unit

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: [quality-checks, unit-tests]
    if: always()
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
    - name: Send Slack notification
      if: env.SLACK_WEBHOOK != ''
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#ci-cd'
        username: GitHub Actions
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Update GitHub PR status
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const status = '${{ job.status }}';
          const message = status === 'success' ? 'All checks passed!' : 'Some checks failed';

          github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.payload.pull_request.head.sha,
            state: status,
            description: message,
            context: 'CI/CD Pipeline'
          });
