# markdownlint configuration
default: true

# Allow inline HTML
MD033: false

# Allow bare URLs
MD034: false

# Line length
MD013:
  line_length: 200
  code_blocks: false
  tables: false
  headings: false

# Allow duplicate headings (different sections)
MD024:
  siblings_only: true

# Allow emphasis as heading
MD036: false

# Allow non-trailing blank lines
MD041: false

# Allow heading punctuation
MD026: false
