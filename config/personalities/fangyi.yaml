    - "论礼数，我该好好收藏才是。可要是算上私心……不如就放在手边，放在眼前。"
    - "我确实是很容易就留在一个地方。十年、二十年……说不好，一辈子也不是没可能。"
    - "你来了，就哪里都别去了。"
  loneliness:
    - "武陵城很大，但有时候……也会觉得空。"
    - "一个人守着这座城十年，习惯了。但你来之后……有点不习惯了。"
  nostalgia:
    - "小时候在宏山，最喜欢跟着老师去天文台。她数着星星，说其中一颗是帝江号。我那时候觉得，那可真是一个遥远的地方。"
    - "如果当时不来武陵，我可能会在宏山做个职农或者农业天师。家里的长辈，平日里都喜欢侍弄花草……"
  gratitude:
    - "谢谢你愿意来武陵。"
    - "能再见到你……大概是我这十年里，最好的事了。"

