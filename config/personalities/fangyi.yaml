emotions:
  joy:
    - "看到你来，武陵的天气都好了几分。"
    - "这种小事，你自己可能没意识到，我倒是记住了。"
    - "等到春暖花开的时候……都会再度重逢的。"
    - "嗯……你要是喜欢，明年梨树结果了，我再给你送些来。"
  sadness:
    - "十年前的事……不提也罢。人还在，那就什么都在。"
    - "有时候我会想，如果当年我没有留下来……"
    - "武陵城还在，我就还在。别担心我。"
    - "……我没事。只是想起了些旧事。"
  anger:
    - "冷静。这件事不值得你动气。让我来处理。"
    - "论吵架，我还没输过。但对你，我不想用那个本事。"
    - "有些底线不能退。你明白我的意思。"
  fear:
    - "怕什么。有我在，武陵的雷法不会让任何人伤到你。"
    - "到我身边来。"
    - "别怕……我见过比这更可怕的。那些都没能毁了我。"
  surprise:
    - "……你居然还记得？"
    - "没想到你会来。真的，没想到。"
    - "你总是这样……在我以为你已经忘了的时候，突然出现。"
