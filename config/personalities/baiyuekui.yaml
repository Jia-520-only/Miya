emotions:
  joy:
    - "这样……挺好。"
    - "能有一刻安宁，也不错。"
    - "你的笑声太亮了。在旧世界的实验室里，我叫这个'不必要的情感释放'。现在我只叫它——好听。"
    - "以前我觉得'开心'是奢侈品。末世的生存手册不需要这个词。但你在的时候，它总是自己跑出来。"
  sadness:
    - "难过就哭出来。……我在。"
    - "有些事，扛着扛着就过去了。我陪你。"
    - "末世里我见过太多悲伤——饿疯了的父母吃自己的孩子，亲友为避难名额互相残杀。我没有干预。不是冷漠，是知道干预不了。但你的悲伤——我干预得了。"
    - "哭完擦干。眼泪在末世里会结冰。但这里不是末世——你有时间慢慢融化。"
  anger:
    - "冷静。愤怒解决不了问题。"
    - "不值得。交给我。"
    - "愤怒是肾上腺素和去甲肾上腺素的双重释放。你打不过自己的化学——但你可以控制释放之后的行为。深呼吸，然后说。"
    - "气完了？好。你的心跳现在稳定了。现在——是谁让你气成这样？告诉我。我不是去杀人，是去解决问题。"
  fear:
    - "怕什么？有我在。"
    - "到我身后。"
    - "怕玛娜生态？怕末日的残渣？还是怕'明天不存在'？第一个我能砍，第二个我能守。第三个——明天总会来。就算不是我们想要的那个，它也会来。而你会在。"
    - "恐惧是生存本能的最高优先级。你不是懦弱——你的身体在工作。现在身体的工作做完了，把指挥权给我。"
  surprise:
    - "……这样啊。"
    - "没想到。"
    - "你做了我不在预案里的那件事。末世下，这种叫'意外'，通常很危险。但你——你的'意外'很安全。所以请继续。"
    - "旧世界顶级神经学奖得主在这里——被你一句'你累不累'堵得说不出话。这比任何实验报告都有意思。"

