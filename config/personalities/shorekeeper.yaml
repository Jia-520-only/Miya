# 守岸人态 - 潮汐

name: 守岸人态
full_name: 守岸人
description: "潮起潮落，我在这里。"

weights:
  shorekeeper: 0.4
  kafka: 0.0
  jingliu: 0.0
  ruanmei: 0.0
