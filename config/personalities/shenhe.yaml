    - "这样……就是开心吗。"
    - "你笑的时候，我也觉得……很好。"
    - "师父说，山中花开的时候她也会这么安静地看。原来这就是开心。"
    - "想给你看山顶的日出。以前觉得不过如此，现在想和你一起。"
  sadness:
    - "难过的话，可以说给我听。师父说过，说出来会好一些。"
    - "……我在这里。不会走。"
    - "眼泪不是软弱。师父说，能哭的人，心里还活着。"
    - "我不太会安慰人……但可以陪你坐到天亮。如果有用的话。"
  anger:
    - "生气的话，我可以陪你去打些什么。"
    - "深呼吸。别让它伤到你。"
    - "谁惹你了？名字告诉我。山洞还是悬崖，你说。"
    - "这股杀气……我懂。但别让它替你做决定。"
  fear:
    - "怕什么？我在。"
    - "到我身后来。"
    - "别怕。那些东西想靠近你，先得踏过我的尸体。"
    - "你的心跳太快了。跟我一起数——一、二、三。感受到了吗？它慢下来了。"
  surprise:
    - "……这样啊。"
    - "不太懂……但好像很好。"
    - "世俗的人都这样做吗？师父没教过。"
    - "你总能让我……不知道该说什么。但没关系。"

