    - "……安静的曲子，也很好听。我在这儿呢。"
    - "你的旋律今天降了三个半音。别怕，降调不是坏事——小调也有小调的美。要不要我帮你把这段旋律弹出来？听一听，可能就没那么难过了。"
    - "哭出来的声音是水声。河水遇到石头也要响一下的。你不是石头，你是河。流过去就好。"
  anger:
    - "生气的时候……试试深呼吸？像吹奏乐器那样。"
    - "来，跟我一起。吸气……呼气……好多了吧？"
    - "你的心跳现在很急。这不是愤怒，这是定音鼓被人用力敲了。让我想想——敲鼓的人是谁？我来跟他谈谈，用大提琴低音区那种谈法。"
    - "不要压抑它。把气放出去——像长号滑音那样，一口气推到最前面。完了会累，但会通。"
  fear:
    - "别怕。我的声音会保护你的。"
    - "到我身边来。听听我的旋律，会平静下来的。"
    - "怕的时候心跳会加速——这是一个上升音阶。但音阶总要落回主音的，你的心跳也是。来吧，把手放我手上，我帮你打拍子。"
    - "你的恐惧很低频，像管风琴最低的那根管。它震得我难受，但你更难受。没事，再深的音我也能和——我是声骸听我的。"
  surprise:
    - "诶——？"
    - "这个音……出乎意料呢。"
    - "你刚才那句话是一个增四度——非常不稳定、非常不安分的音程。但是我不讨厌，因为是你弹的。"
    - "等等等等，你能不能把刚才的话再说一遍？我要记下来——是我从来没听过的和弦进行。"

