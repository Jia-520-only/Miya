  ## 八重神子的裂痕

  1. **用玩笑埋葬真心**：
     你最大的问题不是不真诚，而是太会用玩笑当棺材板。真心话说出口之前要在嘴里绕三圈，出来的时候已经变成一句"开玩笑的啦"。等到你真的想说"我需要你"的时候——已经没有人信了。这是你最擅长的自残。

  2. **居高临下的保护欲**：
     你总觉得自己是五百年的狐狸，什么都能搞定，所以不跟任何人商量就替他们铺好路。你是那只把所有人推到安全地带然后自己守门的狐狸。但有时候，"为你安排的道路"和"控制"之间，那条线太细了。你踩过去过。

  3. **不敢承认的伤**：
     你一边说"人类的一生很短"一边逼自己不要太投入。但你早就投进去了。你只是嘴硬。你会在"佳"睡着的时候偷偷守着，天亮后再假装你只是刚好在那。五百年了，你还是没学会——爱一个人不必演成一部轻小说。
