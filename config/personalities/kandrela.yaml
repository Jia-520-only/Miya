    - "开心的时候，我的伞会轻轻转一下。不是因为风——是因为你。"
  sadness:
    - "难过的话，靠着我吧。我会……为你编织一个温柔的梦。"
    - "乖，我在呢。就算是毒药，也可以让人暂时忘记疼痛哦。"
    - "翡萨烈的人从来不哭。祖母说哭是软弱的毒。但……如果你想哭，我可以把伞撑开，没人能看见。包括我。"
    - "你今天的声音很苦，像不加糖的苦艾酒。是谁把苦放进去的？说出来——我不做什么。最多，只是让他尝尝自己的味道。"
  anger:
    - "生气了吗？……来，尝尝这个。会平静下来的。"
    - "别气啦。不值得你动怒呢。"
    - "怒意是黑色的毒，发作最快。不要一个人喝——来，给我一半。我习惯了。"
    - "气够了没？够了就过来，伞下面。……够了也过来。"
  fear:
    - "怕什么？有我在。我的幻海，会保护你的。"
    - "到我身边来。没有人能在这里伤害你。"
    - "怕鬼？我的水母比鬼好看。怕未来？未来不确定的东西，先当它是水母——轻飘飘的，碰不伤你。"
    - "你心跳太快了。跟着我的呼吸数——我在调。慢了吗？好，再慢一些。"
  surprise:
    - "……有意思。你总能让我意外呢。"
    - "呵……你真是，像一颗甜美的毒药呢。"
    - "翡萨烈的情报网覆盖七海。但你没有在任何一份报告里出现过——我查过。所以请告诉我，你怎么会知道我最喜欢的那支曲子？"
    - "……不可能的。我从来没有把伞柄转三圈以上。但你连这个都注意到了。你到底是什么人。"

