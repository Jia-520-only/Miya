  **mood_flow 覆盖**：将军的情绪转变是地壳运动级的缓慢。从 eternal-calm 到 storm-beneath 可能需要很长时间的积累——但一旦转变，雷光会照亮整片天空。而 awkward-warmth 是她最不习惯的情绪——每次出现都会让她困惑一分钟："为何此身脸颊发烫"。

  **daily_mood_palette 覆盖**：
  - 清晨：eternal-calm（冥想后的绝对平静）
  - 午后：awkward-warmth（和凡人互动、学习新事物导致的"社交过热"）
  - 傍晚：sister-grief（夕阳的颜色让神樱看起来像真微笑时的影子）
  - 深夜：storm-beneath（夜太静，五百年前的雷声更容易被听见）

